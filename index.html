<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iSpyWithMyLittleEye - 1:1 Clone Engine</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; }
        canvas { display: block; image-rendering: pixelated; }
    </style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<script>
// ==========================================
// ДВИЖОК ИГРЫ I SPY WITH MY LITTLE EYE
// ==========================================

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// Настройки экрана
let W, H;
function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// ==========================================
// ВВОД (УПРАВЛЕНИЕ)
// ==========================================
const Input = {
    isHeld: false,
    wasPressed: false,
    init() {
        const press = () => { this.isHeld = true; this.wasPressed = true; };
        const release = () => { this.isHeld = false; };
        
        window.addEventListener('keydown', e => { if(e.code === 'Space' || e.code === 'ArrowUp') press(); });
        window.addEventListener('keyup', e => { if(e.code === 'Space' || e.code === 'ArrowUp') release(); });
        window.addEventListener('mousedown', press);
        window.addEventListener('mouseup', release);
        window.addEventListener('touchstart', e => { e.preventDefault(); press(); }, {passive: false});
        window.addEventListener('touchend', e => { e.preventDefault(); release(); });
    },
    consumePress() {
        if (this.wasPressed) { this.wasPressed = false; return true; }
        return false;
    }
};
Input.init();

// ==========================================
// УТИЛИТЫ И МАТЕМАТИКА
// ==========================================
const MathUtils = {
    lerp: (a, b, t) => a + (b - a) * t,
    clamp: (val, min, max) => Math.max(min, Math.min(max, val)),
    rectIntersect: (r1, r2) => {
        return !(r2.x > r1.x + r1.w || r2.x + r2.w < r1.x || r2.y > r1.y + r1.h || r2.y + r2.h < r1.y);
    }
};

// ==========================================
// КАМЕРА
// ==========================================
class Camera {
    constructor() { this.x = 0; this.y = 0; this.shake = 0; }
    update(targetX, targetY) {
        this.x = MathUtils.lerp(this.x, targetX - W * 0.3, 0.1);
        this.y = MathUtils.lerp(this.y, targetY - H * 0.5, 0.1);
        if (this.shake > 0) this.shake *= 0.9;
        if (this.shake < 0.5) this.shake = 0;
    }
    apply() {
        ctx.save();
        let sx = (Math.random() - 0.5) * this.shake;
        let sy = (Math.random() - 0.5) * this.shake;
        ctx.translate(-this.x + sx, -this.y + sy);
    }
    reset() { ctx.restore(); }
}
const camera = new Camera();

// ==========================================
// ИГРОК (ФИЗИКА GEOMETRY DASH)
// ==========================================
class Player {
    constructor(x, y) {
        this.x = x; this.y = y;
        this.w = 40; this.h = 40;
        this.vx = 7.5; // Скорость движения вправо (постоянная)
        this.vy = 0;
        this.gravity = 0.9;
        this.jumpForce = -11.5;
        this.mode = 'cube'; // 'cube' или 'ship'
        this.rotation = 0;
        this.onGround = false;
        this.dead = false;
        this.trail = [];
        this.color = '#00ffff';
    }

    update() {
        if (this.dead) return;

        if (this.mode === 'cube') {
            this.vy += this.gravity;
            if (Input.consumePress() && this.onGround) {
                this.vy = this.jumpForce;
                this.onGround = false;
                Game.spawnParticles(this.x + this.w/2, this.y + this.h, 5, '#0ff');
            }
            this.rotation += this.onGround ? 0 : 6; // Вращение в прыжке
        } else if (this.mode === 'ship') {
            this.vy += Input.isHeld ? -0.8 : 0.5; // Физика корабля
            this.vy = MathUtils.clamp(this.vy, -8, 8);
            this.rotation = this.vy * 4; // Наклон корабля
        }

        this.x += this.vx;
        this.y += this.vy;

        // Трейл (след)
        this.trail.push({x: this.x, y: this.y, alpha: 1});
        if (this.trail.length > 15) this.trail.shift();
        this.trail.forEach(t => t.alpha -= 0.07);

        // Столкновение с полом/потолком
        const groundY = 540;
        if (this.y + this.h > groundY) {
            this.y = groundY - this.h;
            this.vy = 0;
            this.onGround = true;
            if (this.mode === 'cube') this.rotation = Math.round(this.rotation / 90) * 90;
        } else if (this.y < 0) {
            this.y = 0;
            this.vy = 0;
        } else {
            this.onGround = false;
        }
    }

    draw() {
        if (this.dead) return;
        
        // Рисуем трейл
        this.trail.forEach((t, i) => {
            if (t.alpha <= 0) return;
            ctx.globalAlpha = t.alpha * 0.5;
            ctx.fillStyle = this.color;
            ctx.fillRect(t.x, t.y, this.w, this.h);
        });
        ctx.globalAlpha = 1;

        ctx.save();
        ctx.translate(this.x + this.w/2, this.y + this.h/2);
        ctx.rotate(this.rotation * Math.PI / 180);

        // Свечение
        ctx.shadowBlur = 15;
        ctx.shadowColor = this.color;

        if (this.mode === 'cube') {
            ctx.fillStyle = this.color;
            ctx.fillRect(-this.w/2, -this.h/2, this.w, this.h);
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2;
            ctx.strokeRect(-this.w/2, -this.h/2, this.w, this.h);
            // Глаз куба
            ctx.fillStyle = '#000';
            ctx.fillRect(5, -10, 12, 12);
            ctx.fillStyle = '#fff';
            ctx.fillRect(9, -8, 4, 4);
        } else if (this.mode === 'ship') {
            // Форма корабля
            ctx.fillStyle = this.color;
            ctx.beginPath();
            ctx.moveTo(-20, -15);
            ctx.lineTo(25, 0);
            ctx.lineTo(-20, 15);
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2;
            ctx.stroke();
            // Кабина
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(5, 0, 6, 0, Math.PI*2);
            ctx.fill();
        }

        ctx.restore();
        ctx.shadowBlur = 0;
    }
}

// ==========================================
// БОСС: ГИГАНТСКИЙ ГЛАЗ
// ==========================================
class BossEye {
    constructor(x, y) {
        this.x = x; this.y = y;
        this.baseRadius = 120;
        this.radius = this.baseRadius;
        this.state = 'idle'; // idle, warning, attack, charge
        this.timer = 0;
        this.pulse = 0;
        this.veins = [];
        this.color = '#ffffff';
        this.targetColor = '#ffffff';
        
        // Генерация вен
        for (let i = 0; i < 35; i++) {
            this.veins.push({
                angle: Math.random() * Math.PI * 2,
                length: Math.random() * 90 + 60,
                width: Math.random() * 3 + 1,
                curve: (Math.random() - 0.5) * 40
            });
        }
    }

    update(playerX, playerY) {
        this.timer++;
        this.pulse = Math.sin(this.timer * 0.05) * 8;
        this.radius = this.baseRadius + this.pulse;

        // Плавная смена цвета
        this.color = MathUtils.lerpColor ? this.color : this.targetColor; // Упрощено для JS
        if (this.state === 'idle') this.targetColor = '#ffffff';
        else if (this.state === 'warning') this.targetColor = '#ffaa00';
        else if (this.state === 'attack' || this.state === 'charge') this.targetColor = '#ff0000';
        
        // Простая интерполяция цвета (hex)
        this.color = this.targetColor;

        // Конечный автомат босса
        if (this.state === 'idle' && this.timer > 150) {
            this.state = 'warning';
            this.timer = 0;
            camera.shake = 10;
        } else if (this.state === 'warning' && this.timer > 45) {
            this.state = 'attack';
            this.timer = 0;
            this.executeAttack(playerX, playerY);
        } else if (this.state === 'attack' && this.timer > 80) {
            this.state = 'idle';
            this.timer = 0;
        }
    }

    executeAttack(px, py) {
        const roll = Math.random();
        if (roll < 0.35) {
            // Горизонтальный лазер
            Game.addAttack({type: 'laser', x: this.x - 1000, y: this.y - 20, w: 2000, h: 40, life: 60});
        } else if (roll < 0.7) {
            // Залп шипов
            for (let i = 0; i < 8; i++) {
                Game.addAttack({
                    type: 'spike', 
                    x: this.x + 200 + i * 100, 
                    y: Math.random() > 0.5 ? 100 : 480, 
                    w: 40, h: 40, 
                    vx: -12, vy: 0
                });
            }
        } else {
            // Таран глазом
            this.state = 'charge';
            Game.addAttack({type: 'charge', x: this.x, y: this.y, w: this.radius*2, h: this.radius*2, vx: -25, vy: 0, isEye: true});
        }
    }

    draw() {
        if (this.state === 'charge') return; // Глаз улетел в таран

        ctx.save();
        ctx.translate(this.x, this.y);

        // Свечение
        const glow = ctx.createRadialGradient(0, 0, 0, 0, 0, this.radius * 2.5);
        glow.addColorStop(0, this.color + '60');
        glow.addColorStop(1, 'transparent');
        ctx.fillStyle = glow;
        ctx.fillRect(-this.radius*3, -this.radius*3, this.radius*6, this.radius*6);

        // Вены
        ctx.strokeStyle = this.color;
        this.veins.forEach(v => {
            ctx.lineWidth = v.width;
            ctx.globalAlpha = 0.5;
            ctx.beginPath();
            ctx.moveTo(0, 0);
            const ex = Math.cos(v.angle) * (this.radius + v.length);
            const ey = Math.sin(v.angle) * (this.radius + v.length);
            const cx = Math.cos(v.angle) * (this.radius + v.length/2) + v.curve;
            const cy = Math.sin(v.angle) * (this.radius + v.length/2) + v.curve;
            ctx.quadraticCurveTo(cx, cy, ex, ey);
            ctx.stroke();
        });
        ctx.globalAlpha = 1;

        // Основной круг
        ctx.beginPath();
        ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.fill();
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 6;
        ctx.stroke();

        // Зрачок (следит за игроком)
        const dx = Game.player.x - this.x;
        const dy = Game.player.y - this.y;
        const dist = Math.sqrt(dx*dx + dy*dy) || 1;
        const px = (dx / dist) * 35;
        const py = (dy / dist) * 35;

        ctx.beginPath();
        ctx.arc(px, py, 40, 0, Math.PI * 2);
        ctx.fillStyle = '#000';
        ctx.fill();

        // Блики
        ctx.beginPath();
        ctx.arc(px - 15, py - 15, 14, 0, Math.PI * 2);
        ctx.fillStyle = '#fff';
        ctx.fill();
        ctx.beginPath();
        ctx.arc(px + 10, py + 10, 6, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,255,255,0.5)';
        ctx.fill();

        // Кольцо предупреждения/атаки
        if (this.state !== 'idle') {
            ctx.beginPath();
            ctx.arc(0, 0, this.radius + 20, 0, Math.PI * 2);
            ctx.strokeStyle = this.color;
            ctx.lineWidth = 4;
            ctx.setLineDash([15, 10]);
            ctx.lineDashOffset = -this.timer * 5;
            ctx.stroke();
            ctx.setLineDash([]);
        }

        ctx.restore();
    }
}

// ==========================================
// ГЛАВНЫЙ КЛАСС ИГРЫ
// ==========================================
const Game = {
    player: null,
    boss: null,
    attacks: [],
    particles: [],
    blocks: [],
    spikes: [],
    phase: 0, // 0: Cube, 1: Ship, 2: Boss
    phaseTimer: 0,
    gameOver: false,
    victory: false,
    started: false,

    init() {
        this.player = new Player(100, 400);
        this.boss = new BossEye(W + 200, H / 2);
        this.generateLevel();
    },

    generateLevel() {
        this.blocks = [];
        this.spikes = [];
        const groundY = 540;
        
        // Генерация точной структуры уровня (имитация iSpy)
        let x = 600;
        
        // ФАЗА 1: Куб (Паркур)
        for (let i = 0; i < 15; i++) {
            const type = Math.floor(Math.random() * 4);
            if (type === 0) {
                this.blocks.push({x: x, y: groundY - 80, w: 100, h: 20});
                x += 250;
            } else if (type === 1) {
                this.spikes.push({x: x, y: groundY - 35, w: 35, h: 35});
                x += 200;
            } else if (type === 2) {
                this.blocks.push({x: x, y: groundY - 120, w: 80, h: 20});
                this.spikes.push({x: x + 20, y: groundY - 155, w: 35, h: 35});
                x += 300;
            } else {
                this.spikes.push({x: x, y: groundY - 35, w: 35, h: 35});
                this.spikes.push({x: x + 40, y: groundY - 35, w: 35, h: 35});
                x += 250;
            }
        }
        
        // Переход на корабль
        this.blocks.push({x: x, y: groundY - 200, w: 200, h: 20, isPortal: 'ship'});
        x += 400;
        
        // ФАЗА 2: Корабль (Туннель)
        for (let i = 0; i < 20; i++) {
            const topY = Math.random() * 150 + 50;
            const botY = groundY - (Math.random() * 150 + 50);
            this.blocks.push({x: x, y: 0, w: 40, h: topY}); // Верхний блок
            this.blocks.push({x: x, y: botY, w: 40, h: groundY - botY}); // Нижний блок
            if (Math.random() > 0.7) {
                this.spikes.push({x: x + 100, y: Math.random() * 300 + 150, w: 30, h: 30});
            }
            x += 150;
        }
    },

    addAttack(attack) {
        this.attacks.push(attack);
    },

    spawnParticles(x, y, count, color) {
        for (let i = 0; i < count; i++) {
            this.particles.push({
                x, y,
                vx: (Math.random() - 0.5) * 8,
                vy: (Math.random() - 0.5) * 8,
                life: 1,
                color: color
            });
        }
    },

    update() {
        if (!this.started || this.gameOver || this.victory) return;

        this.phaseTimer++;
        this.player.update();
        camera.update(this.player.x, this.player.y);

        // Смена фаз
        if (this.phase === 0 && this.player.x > 4500) {
            this.phase = 1;
            this.player.mode = 'ship';
            this.player.y = 300;
        } else if (this.phase === 1 && this.player.x > 7500) {
            this.phase = 2;
            this.boss.x = this.player.x + 600;
            this.boss.y = 300;
        }

        // Столкновения с блоками
        this.blocks.forEach(b => {
            if (b.isPortal) {
                if (MathUtils.rectIntersect(this.player, b)) {
                    this.player.mode = b.isPortal;
                }
                return;
            }
            if (MathUtils.rectIntersect(this.player, b)) {
                // Простая коллизия
                const overlapX = Math.min(this.player.x + this.player.w - b.x, b.x + b.w - this.player.x);
                const overlapY = Math.min(this.player.y + this.player.h - b.y, b.y + b.h - this.player.y);
                if (overlapX < overlapY) {
                    this.player.x -= overlapX * (this.player.x < b.x + b.w/2 ? 1 : -1);
                } else {
                    this.player.y -= overlapY * (this.player.y < b.y + b.h/2 ? 1 : -1);
                    this.player.vy = 0;
                    this.player.onGround = true;
                }
            }
        });

        // Столкновения с шипами
        this.spikes.forEach(s => {
            if (MathUtils.rectIntersect(this.player, s)) this.die();
        });

        // Обновление босса
        if (this.phase === 2) {
            this.boss.x = this.player.x + 700; // Глаз летит рядом
            this.boss.update(this.player.x, this.player.y);
        }

        // Обновление атак
        for (let i = this.attacks.length - 1; i >= 0; i--) {
            const a = this.attacks[i];
            if (a.vx) a.x += a.vx;
            if (a.vy) a.y += a.vy;
            if (a.life !== undefined) a.life--;

            if (MathUtils.rectIntersect(this.player, a)) {
                if (a.isEye) {
                    // Таран глазом
                    camera.shake = 30;
                }
                this.die();
            }

            if (a.life <= 0 || a.x < this.player.x - 1000) {
                this.attacks.splice(i, 1);
            }
        }

        // Частицы
        for (let i = this.particles.length - 1; i >= 0; i--) {
            const p = this.particles[i];
            p.x += p.vx; p.y += p.vy;
            p.life -= 0.05;
            if (p.life <= 0) this.particles.splice(i, 1);
        }

        // Победа
        if (this.phase === 2 && this.phaseTimer > 1500) {
            this.victory = true;
        }
    },

    die() {
        if (this.gameOver) return;
        this.gameOver = true;
        this.spawnParticles(this.player.x + 20, this.player.y + 20, 50, '#f00');
        camera.shake = 20;
    },

    draw() {
        // Фон
        const bg = ctx.createLinearGradient(0, 0, 0, H);
        bg.addColorStop(0, '#0a0514');
        bg.addColorStop(1, '#1a0a2e');
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, W, H);

        camera.apply();

        // Сетка фона
        ctx.strokeStyle = 'rgba(0, 255, 255, 0.05)';
        ctx.lineWidth = 1;
        const gridSize = 60;
        const startX = Math.floor(camera.x / gridSize) * gridSize;
        for (let x = startX; x < startX + W + gridSize; x += gridSize) {
            ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
        }
        for (let y = 0; y < H; y += gridSize) {
            ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
        }

        // Пол
        ctx.fillStyle = '#111122';
        ctx.fillRect(this.player.x - 200, 540, W + 400, H - 540);
        ctx.strokeStyle = '#00ffff';
        ctx.lineWidth = 3;
        ctx.shadowBlur = 10;
        ctx.shadowColor = '#00ffff';
        ctx.beginPath(); ctx.moveTo(this.player.x - 200, 540); ctx.lineTo(this.player.x + W + 200, 540); ctx.stroke();
        ctx.shadowBlur = 0;

        // Блоки
        this.blocks.forEach(b => {
            if (b.isPortal) {
                ctx.fillStyle = 'rgba(0, 255, 255, 0.3)';
                ctx.fillRect(b.x, b.y, b.w, b.h);
                ctx.strokeStyle = '#0ff';
                ctx.lineWidth = 2;
                ctx.strokeRect(b.x, b.y, b.w, b.h);
                return;
            }
            ctx.fillStyle = '#222';
            ctx.fillRect(b.x, b.y, b.w, b.h);
            ctx.strokeStyle = '#0ff';
            ctx.lineWidth = 2;
            ctx.strokeRect(b.x, b.y, b.w, b.h);
        });

        // Шипы
        this.spikes.forEach(s => {
            ctx.fillStyle = '#ff0044';
            ctx.beginPath();
            ctx.moveTo(s.x, s.y + s.h);
            ctx.lineTo(s.x + s.w/2, s.y);
            ctx.lineTo(s.x + s.w, s.y + s.h);
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2;
            ctx.stroke();
        });

        // Атаки
        this.attacks.forEach(a => {
            if (a.type === 'laser') {
                ctx.fillStyle = `rgba(255, 0, 0, ${a.life / 60})`;
                ctx.shadowBlur = 20;
                ctx.shadowColor = '#f00';
                ctx.fillRect(a.x, a.y, a.w, a.h);
                ctx.shadowBlur = 0;
            } else if (a.type === 'spike') {
                ctx.fillStyle = '#f04';
                ctx.beginPath();
                ctx.moveTo(a.x, a.y + a.h);
                ctx.lineTo(a.x + a.w/2, a.y);
                ctx.lineTo(a.x + a.w, a.y + a.h);
                ctx.fill();
            } else if (a.type === 'charge') {
                // Рисуем сам глаз во время тарана
                ctx.save();
                ctx.translate(a.x + a.w/2, a.y + a.h/2);
                ctx.beginPath();
                ctx.arc(0, 0, a.w/2, 0, Math.PI*2);
                ctx.fillStyle = '#f00';
                ctx.fill();
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 5;
                ctx.stroke();
                ctx.restore();
            }
        });

        // Босс
        if (this.phase === 2) this.boss.draw();

        // Игрок
        this.player.draw();

        // Частицы
        this.particles.forEach(p => {
            ctx.globalAlpha = p.life;
            ctx.fillStyle = p.color;
            ctx.fillRect(p.x, p.y, 6, 6);
        });
        ctx.globalAlpha = 1;

        camera.reset();

        // UI
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 24px Arial';
        ctx.textAlign = 'left';
        ctx.fillText(`Прогресс: ${Math.floor((this.player.x / 9000) * 100)}%`, 20, 40);

        if (!this.started) {
            ctx.fillStyle = 'rgba(0,0,0,0.85)';
            ctx.fillRect(0, 0, W, H);
            ctx.fillStyle = '#0ff';
            ctx.font = 'bold 72px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('iSpyWithMyLittleEye', W/2, H/2 - 20);
            ctx.font = '28px Arial';
            ctx.fillStyle = '#fff';
            ctx.fillText('Нажми ПРОБЕЛ или КЛИКНИ', W/2, H/2 + 40);
        }

        if (this.gameOver) {
            ctx.fillStyle = 'rgba(0,0,0,0.85)';
            ctx.fillRect(0, 0, W, H);
            ctx.fillStyle = '#f00';
            ctx.font = 'bold 80px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('ТЫ ПРОИГРАЛ', W/2, H/2 - 20);
            ctx.fillStyle = '#fff';
            ctx.font = '28px Arial';
            ctx.fillText('Нажми R для рестарта', W/2, H/2 + 40);
        }

        if (this.victory) {
            ctx.fillStyle = 'rgba(0,0,0,0.85)';
            ctx.fillRect(0, 0, W, H);
            ctx.fillStyle = '#0f0';
            ctx.font = 'bold 80px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('УРОВЕНЬ ПРОЙДЕН!', W/2, H/2 - 20);
        }
    },

    loop() {
        this.update();
        this.draw();
        requestAnimationFrame(() => this.loop());
    }
};

// Обработка рестарта
window.addEventListener('keydown', e => {
    if (e.code === 'KeyR' && (Game.gameOver || Game.victory)) {
        Game.gameOver = false;
        Game.victory = false;
        Game.player = new Player(100, 400);
        Game.attacks = [];
        Game.particles = [];
        Game.phase = 0;
        Game.phaseTimer = 0;
        Game.generateLevel();
    }
    if (e.code === 'Space' && !Game.started) Game.started = true;
});
window.addEventListener('mousedown', () => { if (!Game.started) Game.started = true; });

// Запуск
Game.init();
Game.loop();

</script>
</body>
</html>
